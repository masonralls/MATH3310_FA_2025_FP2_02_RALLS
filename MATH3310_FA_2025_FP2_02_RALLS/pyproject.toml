[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "MATH3310_FA_2025_FP2_02_RALLS"
version = "0.0.1"
description = "Analysis of the effect of social media on mental health"
authors = [
  { name = "mason" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["MATH3310_FA_2025_FP2_02_RALLS"]
include = ["pyproject.toml", "MATH3310_FA_2025_FP2_02_RALLS/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["MATH3310_FA_2025_FP2_02_RALLS"]
force-sort-within-sections = true

